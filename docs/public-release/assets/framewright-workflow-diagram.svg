<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Framewright 4.1.1 workflow</title>
  <desc id="desc">Approved director intent, production assets, and shot decisions enter the central Production Spine. The spine branches independently to Storyboard, Shot Plate, Keyframe, and Video Prompt. Video Prompt continues to a Target Adapter. One active stage runs at a time.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#191919"/>
    </marker>
    <pattern id="ticks" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0h7M0 0v7" stroke="#8f8d88" stroke-width="1" opacity="0.16" fill="none"/>
    </pattern>
  </defs>
  <rect width="1600" height="760" fill="#f5f4ef"/>
  <rect x="32" y="32" width="1536" height="696" fill="url(#ticks)" opacity="0.38"/>
  <g fill="none" stroke="#191919" stroke-width="2">
    <rect x="72" y="287" width="290" height="186" rx="2" fill="#f5f4ef"/>
    <rect x="492" y="245" width="370" height="270" rx="2" fill="#eeece5" stroke-width="3"/>
    <rect x="1018" y="92" width="295" height="104" rx="2" fill="#f5f4ef"/>
    <rect x="1018" y="244" width="295" height="104" rx="2" fill="#f5f4ef"/>
    <rect x="1018" y="396" width="295" height="104" rx="2" fill="#f5f4ef"/>
    <rect x="1018" y="548" width="295" height="104" rx="2" fill="#f5f4ef"/>
    <rect x="1362" y="548" width="180" height="104" rx="2" fill="#eeece5"/>
  </g>
  <g fill="none" stroke="#191919" stroke-width="2" marker-end="url(#arrow)">
    <path d="M362 380H492"/>
    <path d="M862 380H930V144H1018"/>
    <path d="M930 296H1018"/>
    <path d="M930 448H1018"/>
    <path d="M862 380H930V600H1018"/>
    <path d="M1313 600H1362"/>
  </g>
  <g fill="#191919" font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="323" font-size="15" font-weight="700" letter-spacing="2">UPSTREAM AUTHORITY</text>
    <text x="92" y="365" font-size="23" font-weight="700">APPROVED DIRECTOR INTENT</text>
    <text x="92" y="399" font-size="20">PRODUCTION ASSETS</text>
    <text x="92" y="433" font-size="20">SHOT DECISIONS</text>
    <text x="522" y="305" font-size="16" font-weight="700" letter-spacing="2">CENTRAL COMPILER STATE</text>
    <text x="522" y="368" font-size="38" font-weight="700" letter-spacing="1">PRODUCTION SPINE</text>
    <text x="522" y="412" font-size="19">approved scope · continuity · authority</text>
    <text x="522" y="450" font-size="19">one current production reading</text>
    <text x="1048" y="133" font-size="16" font-weight="700" letter-spacing="2">ACTIVE STAGE A</text>
    <text x="1048" y="168" font-size="25" font-weight="700">STORYBOARD</text>
    <text x="1048" y="285" font-size="16" font-weight="700" letter-spacing="2">ACTIVE STAGE B</text>
    <text x="1048" y="320" font-size="25" font-weight="700">SHOT PLATE</text>
    <text x="1048" y="437" font-size="16" font-weight="700" letter-spacing="2">ACTIVE STAGE C</text>
    <text x="1048" y="472" font-size="25" font-weight="700">KEYFRAME</text>
    <text x="1048" y="589" font-size="16" font-weight="700" letter-spacing="2">ACTIVE STAGE D</text>
    <text x="1048" y="624" font-size="25" font-weight="700">VIDEO PROMPT</text>
    <text x="1382" y="589" font-size="14" font-weight="700" letter-spacing="1.5">MODEL-FACING</text>
    <text x="1382" y="624" font-size="22" font-weight="700">TARGET</text>
    <text x="1382" y="647" font-size="22" font-weight="700">ADAPTER</text>
  </g>
  <g fill="none" stroke="#55534f" stroke-width="1.5">
    <path d="M492 560H862"/>
    <path d="M508 554v12M846 554v12"/>
  </g>
  <g fill="#55534f" font-family="Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="1.4">
    <text x="496" y="594">ONE ACTIVE STAGE AT A TIME</text>
    <text x="72" y="696">Framewright compiles the approved decision state; it does not direct, batch, or auto-advance the stages.</text>
  </g>
  <g fill="none" stroke="#191919" stroke-width="1.5" opacity="0.75">
    <path d="M48 48h24M60 36v24M1528 48h24M1540 36v24M48 712h24M60 700v24M1528 712h24M1540 700v24"/>
  </g>
</svg>
