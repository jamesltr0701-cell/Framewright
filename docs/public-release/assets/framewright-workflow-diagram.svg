      <circle cx="294" cy="244" r="0.75" fill="#6F6657" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" fill="#E9E3D3"/>
  <rect width="1600" height="760" fill="url(#paperFibers)" opacity="0.76"/>

