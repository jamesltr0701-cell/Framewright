<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Framewright workflow: production spine and active stages</title>
  <desc id="desc">Approved director intent, production assets, and shot decisions form one Production Spine. From that approved state, choose one independent active stage: Storyboard, Shot Plate, Keyframe, or Video Prompt. Only Video Prompt proceeds to a Target Adapter.</desc>
