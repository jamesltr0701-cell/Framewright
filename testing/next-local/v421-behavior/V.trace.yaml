prompt: 'GENERATION GOAL

  A 12-second, 16:9 live-action scene with natural room illumination, exactly two
  fixed-camera shots and one hard cut.


  STAGE PLAN

  Shot 1: Locked camera, chest-up close-up of 周 in three-quarter facial view, standing
  in an otherwise empty classroom and looking out of the window. Over his visible
  face, 周''s remembered voice is heard as voiceover, in Chinese, once: “那时我还不知道。”
  His lips remain closed throughout this shot; the voiceover has no visible speaking
  or synchronized mouth movement. Hold this view through the end of the voiceover.


  Shot 2: Hard cut to a locked medium shot of 安 at the classroom doorway, her face
  in three-quarter view. 安 speaks in the scene, in Chinese, once: “走吧。” Her visible
  lips synchronize with the complete line. Remain on her at the doorway as the line
  ends, with no added gesture or speech.


  AUDIO

  Natural classroom room tone continues beneath the two specified vocal events.


  NEGATIVE

  No additional dialogue, human vocalizations or sighs, music, or subtitles.

  '
