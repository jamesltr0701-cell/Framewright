core_version: 4.2.0
prompt: 'VISUAL STYLE

  Naturalistic live action in steady indoor light.


  AUDIO

  Soft room tone and slight clothing movement with the visible shift. No music. Only
  the one specified line; no other speech or human vocalization.


  CAMERA EXECUTION

  One uninterrupted medium-close shot holds Lin with Mei present in the same camera
  relationship.


  BEATS

  Lin carries genuine excitement about tomorrow, with a small bright expression still
  on her face. Mei says exactly “The plan is cancelled.” Lin hears Mei. For a brief
  beat her earlier smile remains while her gaze registers the meaning; understanding
  arrives after the words. Her smile subsides and her posture draws slightly inward
  as she contains the disappointment, still beside Mei. She does not turn the feeling
  against Mei. Mei stays present, notices the withdrawal, and gives Lin room to remain
  there. Hold the unresolved, restrained response without a cut.'
character_limit: 10000
active_stages:
- video_prompt
director_modes:
- apprentice
conversation_mode_declared: true
production_spines:
