    transition: For a brief beat her earlier smile remains while her gaze registers
      the meaning; understanding arrives after the words.
    response: Her smile subsides and her posture draws slightly inward as she contains
      the disappointment, still beside Mei.
    aftermath: Mei stays present, notices the withdrawal, and gives Lin room to remain
      there.
