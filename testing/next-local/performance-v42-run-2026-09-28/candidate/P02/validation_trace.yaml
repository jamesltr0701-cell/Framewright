- beat_id: cancellation
  trigger: Mei says exactly “The plan is cancelled.”
  interpretation_or_delay: Earlier joy briefly survives before understanding.
  physical_carriers:
  - shared_function: restrained disappointment
    relation: sequential
    elements:
    - smile lingers while gaze registers meaning
    - smile subsides and posture draws inward
  release_or_aftermath: Lin remains beside Mei; Mei receives the response.
  shot_scale: medium-close
  carrier_legible: true
  prompt_evidence:
