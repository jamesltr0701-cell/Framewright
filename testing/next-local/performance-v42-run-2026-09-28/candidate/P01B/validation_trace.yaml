core_version: 4.2.0
prompt: 'VISUAL STYLE

  Naturalistic live action in steady indoor light.


  AUDIO

  Soft room tone and faint clothing movement with visible shifts. No music, speech,
  or human vocalization.


  CAMERA EXECUTION

  One uninterrupted held mid-close two-person frame keeps Lin and Mei legible together.


  BEATS

  Lin first finishes hearing Mei and holds still for the end of the thought. Lin''s
  small nod is accompanied by a brief lowering of her eyelids. She then lifts her
  head and reconnects her gaze with Mei. The complete sequence reads as sincere agreement
  to stay in the plan. Mei stays present and follows Lin''s silent response. Hold
  both women together without a cut.'
