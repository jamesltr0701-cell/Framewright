core_version: 4.2.0
prompt: 'VISUAL STYLE

  Naturalistic live action in steady indoor light.


  AUDIO

  Soft room tone and faint clothing movement with visible shifts. No music, speech,
  or human vocalization.


  CAMERA EXECUTION

  One uninterrupted held mid-close two-person frame keeps Lin and Mei legible together.


  BEATS

  Mei has just finished her practical explanation and stays attentive. Lin receives
  the last thought with her gaze on Mei. Lin lets a small nod form as her shoulders
  ease. She meets Mei''s eyes again and remains in the plan, a quiet, genuine agreement.
  Mei follows Lin''s silent response with a natural shift of attention. Hold the shared
  decision without a cut.'
